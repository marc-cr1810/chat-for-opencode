name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Package extension
        run: npx vsce package --no-dependencies --out opencode-vscode-${{ github.sha }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
