name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package extension
        run: npx vsce package --no-dependencies --out chat-for-opencode-${{ github.sha }}.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: chat-for-opencode-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
